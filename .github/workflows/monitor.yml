name: Monitor (hourly, all companies)

on:
  schedule:
    # Every hour around the clock, at :17 past (GitHub drops far more
    # runs scheduled exactly on the hour). Alerts are sent from every run,
    # 24/7 - quiet hours are left to the phone's Do Not Disturb.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: >-
          Baseline run: scan everything (career sites and Simplify) and
          mark all current matches as sent WITHOUT notifying.
        type: boolean
        default: false
      test_alert:
        description: >-
          Send one test notification (ntfy, or SMS if NTFY_TOPIC isn't
          set) before the run, to check secrets and phone delivery.
        type: boolean
        default: false

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ntfy push is used when NTFY_TOPIC is set; otherwise the
      # email-to-SMS settings below are used.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      EMAIL_SENDER_ADDRESS: ${{ secrets.EMAIL_SENDER_ADDRESS }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      NOTIFICATION_PHONE_NUMBER: ${{ secrets.NOTIFICATION_PHONE_NUMBER }}
      SMS_CARRIER_GATEWAY: ${{ secrets.SMS_CARRIER_GATEWAY }}
      BASELINE: ${{ inputs.baseline && '--baseline' || '' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (with OS deps)
        run: playwright install --with-deps chromium

      - name: Send test notification
        if: ${{ inputs.test_alert }}
        run: python src/sms_alerts.py

      - name: Run full monitor (all companies, including custom scraper)
        run: python src/internship_monitor_service.py $BASELINE

      # Runs even if the monitor step failed, so one source breaking
      # doesn't silence the other. Uses the same notification path.
      - name: Check Simplify listings (watchlist companies)
        if: ${{ !cancelled() }}
        run: python src/simplify_alerts.py $BASELINE

      - name: Commit and push database changes (only if something changed)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add database/internship_agent.db
          git diff --cached --quiet && exit 0
          git commit -m "Monitor run: update internship database [skip ci]"
          git pull --rebase origin main
          git push
